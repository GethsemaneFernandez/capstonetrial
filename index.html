


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-box" id="login-box">
            <h1>Login</h1>
            <form id="login-form" action="login.php" method="POST">
                <div class="input-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit">Login</button>
                <p>Don't have an account? <a href="#" onclick="openRegisterForm()">Register</a></p>
            </form>
        </div>

        <div class="form-box" id="register-box" style="display: none;">
            <h1>Register</h1>
            <form id="register-form" action="registerforlogin.php" method="POST" onsubmit="return validatePassword()">
                <div class="input-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <div class="input-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" required>
                </div>
                <button type="submit">Register</button>
                <p><a href="#" onclick="goBackToLogin()">Back to Login</a></p>
            </form>
        </div>
    </div>

    <script>
        function openRegisterForm() {
            document.getElementById('register-box').style.display = 'block';
            document.getElementById('login-box').style.display = 'none';
        }

        function goBackToLogin() {
            document.getElementById('register-box').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
